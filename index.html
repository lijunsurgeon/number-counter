<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>语音数字求和</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6fa;margin:0;color:#19243a}.wrap{max-width:520px;margin:auto;padding:18px}h2{margin:8px 0 16px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #14213d0b}.sum{font-size:52px;font-weight:800;text-align:center}.muted{color:#667085;font-size:14px}.center{text-align:center}button{border:0;border-radius:13px;padding:15px 12px;font-size:17px;font-weight:700;background:#e9edf5;color:#19243a;touch-action:manipulation}button:disabled{opacity:.4}.primary{background:#1878e8;color:white}.orange{background:#fff0da;color:#a64d00}.red{background:#ffe8e8;color:#ad2727}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.buttons button{font-size:25px;padding:22px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{width:100%;margin-top:9px}.record{min-height:54px;line-height:1.8;word-break:break-word}.status{font-weight:600}.stat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:14px}.stat div{background:#f1f5fa;border-radius:8px;padding:9px 1px}#preview{color:#697386;min-height:20px}small{color:#667085}</style></head><body><main class="wrap"><h2>🎙️ 语音数字求和</h2><section class="card center"><div class="muted">已记录 <span id="count">0</span> 个数字</div><div class="sum" id="total">—</div><div class="muted">点击「求和」显示总数</div></section><section class="card"><div class="status" id="status">● 尚未开始</div><p class="muted">连续说：1，加3，加4，加6，加1。只记录1～7。</p><div class="actions"><button class="primary" id="start">🎤 开始输入</button><button class="orange" id="pause" disabled>⏸ 暂停</button></div><div id="preview"></div><button class="wide" id="undo">↶ 撤销上一个数字</button></section><section class="card"><b>输入记录</b><div class="record" id="record">暂无记录</div><button class="primary wide" id="calculate">＝ 求和</button></section><section class="card"><b>手动补充（1～7）</b><div class="buttons" id="keys"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button></div></section><section class="card"><b>各数字出现次数</b><div class="stat" id="stats"></div><button class="red wide" id="clear">清空所有记录</button></section><p class="muted center">数据自动保存在本设备当前网站中。语音功能请使用 iPhone Safari 打开 HTTPS 网页测试。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const KEY='voice-sum-1to7-v1';let nums=[];try{let v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v))nums=v.filter(n=>Number.isInteger(n)&&n>=1&&n<=7)}catch(e){}let showSum=false,desired=false,active=false,rec=null,retry=null,blocked=false;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function render(){ $('count').textContent=nums.length;$('total').textContent=showSum?nums.reduce((a,b)=>a+b,0):'—';$('record').textContent=nums.length?nums.join(' + '):'暂无记录';$('stats').innerHTML=Array.from({length:7},(_,i)=>`<div><b>${i+1}</b><br>${nums.filter(n=>n===i+1).length}次</div>`).join('');$('undo').disabled=!nums.length;try{localStorage.setItem(KEY,JSON.stringify(nums))}catch(e){}}function add(n){nums.push(n);showSum=false;render()}function status(s){$('status').textContent=s}function controls(){ $('start').textContent=desired?'🎤 正在输入':'🎤 开始输入';$('start').disabled=desired;$('pause').disabled=!desired;$('pause').textContent='⏸ 暂停'}function parse(t){let normalized=t.replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296)).replace(/[一壹]/g,'1').replace(/[二两贰]/g,'2').replace(/[三叁]/g,'3').replace(/[四肆]/g,'4').replace(/[五伍]/g,'5').replace(/[六陆]/g,'6').replace(/[七柒]/g,'7');let found=[];for(const m of normalized.matchAll(/\d+/g)){if(m[0].length===1&&Number(m[0])>=1&&Number(m[0])<=7)found.push(Number(m[0]))}return found}function stop(){desired=false;clearTimeout(retry);controls();$('preview').textContent='';if(rec){try{rec.stop()}catch(e){}}status('⏸ 已暂停')}function begin(){if(!SR){status('当前浏览器不支持网页语音识别；可使用手动按钮');return}if(!desired)return;try{rec=new SR();rec.lang='zh-CN';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;rec.onstart=()=>{active=true;status('🔴 正在聆听，请连续说数字')};rec.onresult=e=>{let interim=[];for(let i=e.resultIndex;i<e.results.length;i++){let text=e.results[i][0].transcript;if(e.results[i].isFinal){for(const n of parse(text))add(n)}else interim.push(text)}$('preview').textContent=interim.length?'识别中：'+interim.join(' '):''};rec.onerror=e=>{status('语音提示：'+e.error);if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){blocked=true;desired=false;controls()}};rec.onend=()=>{active=false;if(desired&&!blocked){status('正在尝试继续聆听…');retry=setTimeout(begin,550)}else if(!desired)status('⏸ 已暂停')};rec.start()}catch(e){status('无法启动语音识别：'+e.message);desired=false;controls()}}$('start').onclick=()=>{blocked=false;desired=true;controls();begin()};$('pause').onclick=stop;$('undo').onclick=()=>{nums.pop();showSum=false;render()};$('calculate').onclick=()=>{showSum=true;render()};$('clear').onclick=()=>{if(confirm('确定清空所有数字吗？')){stop();nums=[];showSum=false;render()}};$('keys').addEventListener('click',e=>{if(e.target.tagName==='BUTTON')add(Number(e.target.textContent))});render();controls();if(!SR)status('⚠️ 浏览器不支持网页语音识别，可手动输入');})();
</script></body></html>
