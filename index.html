<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="数字计数器"><meta name="theme-color" content="#f6f8fc"><title>数字计数器</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#15213b;background:#f6f8fc}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin-inline:auto}h1{font-size:25px;margin:24px 0 18px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{border-radius:20px;background:#e3f1ff;text-align:center;padding:19px 6px}.stat:nth-child(2){background:#e5f7ed}.stat label{font-size:15px}.stat strong{display:block;font-size:53px;margin-top:5px;color:#1456c8;font-variant-numeric:tabular-nums}.stat:nth-child(2) strong{color:#13845d}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.digit{border:1px solid #cbdaf6;border-radius:20px;min-height:116px;background:#e8f1ff;color:#123a87;font-size:54px;font-weight:700;touch-action:manipulation;box-shadow:0 2px 0 #d6e0ef}.digit small{display:block;font-size:14px;font-weight:400;color:#536079}.digit:nth-child(3n+2){background:#e5f8ec;color:#116b4b;border-color:#c7e9d2}.digit:nth-child(3n){background:#ffe9ec;color:#9c203b;border-color:#f4cdd4}.digit:last-child{grid-column:2}.digit:active{transform:scale(.96)}section{background:white;border-radius:20px;padding:17px;margin-top:20px;box-shadow:0 2px 14px #182b4b0a}h2{font-size:18px;margin:0 0 12px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:9px 6px;text-align:center;border-bottom:1px solid #edf0f5}th{font-weight:500;color:#667085}tr:last-child td{border-bottom:0}.quick-undo{margin-top:14px}.quick-undo button{width:100%;border:0;border-radius:16px;background:#2575ed;color:white;font-size:19px;font-weight:700;padding:18px;min-height:62px;touch-action:manipulation}.quick-undo button:active{transform:scale(.99)}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}.actions button{border:0;border-radius:14px;padding:15px 3px;font-size:15px;font-weight:600;color:white;background:#2575ed}.actions button:nth-child(1){background:#ec5164}.actions button:nth-child(2){background:#16a678}button:disabled{opacity:.45}.note{color:#687587;font-size:12px;text-align:center;margin:18px 0}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1d2939;color:white;padding:10px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}</style></head><body><h1>数字计数器</h1><div class="summary"><div class="stat"><label>总和</label><strong id="sum">0</strong></div><div class="stat"><label>已输入数量</label><strong id="count">0</strong></div></div><div class="pad" id="pad"><button class="digit" type="button" data-number="1">1<small id="n1">次数 0</small></button><button class="digit" type="button" data-number="2">2<small id="n2">次数 0</small></button><button class="digit" type="button" data-number="3">3<small id="n3">次数 0</small></button><button class="digit" type="button" data-number="4">4<small id="n4">次数 0</small></button><button class="digit" type="button" data-number="5">5<small id="n5">次数 0</small></button><button class="digit" type="button" data-number="6">6<small id="n6">次数 0</small></button><button class="digit" type="button" data-number="7">7<small id="n7">次数 0</small></button></div><div class="quick-undo"><button id="undo" type="button">↶ 撤销上一次输入</button></div><section><h2>详细统计</h2><table><thead><tr><th>数字</th><th>次数</th><th>合计</th></tr></thead><tbody id="rows"></tbody></table></section><div class="actions"><button id="reset">清零</button><button id="copy">复制结果</button></div><p class="note">每次点击自动保存在本机浏览器中 · 无需账号</p><div class="toast" id="toast" role="status"></div><script>const KEY='number-counter-1to7-v1';let history=[];try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v)&&v.length<=100000&&v.every(n=>Number.isInteger(n)&&n>=1&&n<=7))history=v}catch(e){}const pad=document.getElementById('pad'),rows=document.getElementById('rows');for(const b of pad.querySelectorAll('button[data-number]')){b.onclick=()=>{history.push(Number(b.dataset.number));save();render()}}function save(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){notify('存储空间不足，请复制结果备份')}}function render(){let counts=Array(7).fill(0),sum=0;for(let n of history){counts[n-1]++;sum+=n}document.getElementById('sum').textContent=sum;document.getElementById('count').textContent=history.length;rows.innerHTML='';for(let i=0;i<7;i++){document.getElementById('n'+(i+1)).textContent='次数 '+counts[i];let tr=document.createElement('tr');for(let val of [i+1,counts[i],counts[i]*(i+1)]){let td=document.createElement('td');td.textContent=val;tr.appendChild(td)}rows.appendChild(tr)}document.getElementById('undo').disabled=!history.length;document.getElementById('reset').disabled=!history.length;document.getElementById('copy').disabled=!history.length}let toastTimer;function notify(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2000)}document.getElementById('undo').onclick=()=>{if(history.length){history.pop();save();render()}};document.getElementById('reset').onclick=()=>{if(history.length&&confirm('确定清零全部计数吗？此操作无法撤销。')){history=[];save();render();notify('已清零')}};document.getElementById('copy').onclick=async()=>{let c=Array(7).fill(0);history.forEach(n=>c[n-1]++);let result='总和：'+history.reduce((a,b)=>a+b,0)+'\n已输入数量：'+history.length+'\n'+c.map((n,i)=>(i+1)+' × '+n+' = '+(i+1)*n).join('\n');try{await navigator.clipboard.writeText(result);notify('已复制结果')}catch(e){let t=document.createElement('textarea');t.value=result;document.body.appendChild(t);t.select();let ok=document.execCommand('copy');t.remove();notify(ok?'已复制结果':'复制失败，请截屏保存')}};render();</script></body></html>
